[project]
name = "shellmentor"
version = "4.4.0"
description = "Professional Linux Command-Line Learning Platform"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kunal Saraswat"}]
readme = "README.md"
# Upper bounds are deliberate: Textual changed both its markup parser and
# Screen internals between major versions, which silently broke rendering and
# crashed the challenge screen. Re-test before widening these.
dependencies = [
    "textual>=1.0,<9",
    "rich>=13.7,<16",
    "pyyaml>=6.0.1,<7",
    "platformdirs>=4.2.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ShellMentor uses a flat layout (modules at the repository root, no
# src/shellmentor/ package), so hatchling cannot infer what belongs in the
# wheel. List the runtime modules and data directories explicitly.
[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "main.py",
    "challenge.py",
    "data_manager.py",
    "learning.py",
    "playground.py",
    "progress.py",
    "ui.py",
    "ui_core.py",
    "ui_screens.py",
    "ui_activities.py",
    "utils.py",
    "data",
    "themes",
    "workspace",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "__init__.py",
    "main.py",
    "challenge.py",
    "data_manager.py",
    "learning.py",
    "playground.py",
    "progress.py",
    "ui.py",
    "ui_core.py",
    "ui_screens.py",
    "ui_activities.py",
    "utils.py",
    "test_core.py",
    "data",
    "themes",
    "workspace",
    "shellmentor.sh",
    "requirements.txt",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
