name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q .
      - name: Run tests
        # Includes test_ui_smoke.py, which mounts every screen through
        # Textual's headless pilot. compileall alone cannot catch a NameError
        # inside a screen body or a method that shadows a Textual internal.
        run: python -m pytest -q
      - name: Verify the package builds
        run: python -m pip install build && python -m build
